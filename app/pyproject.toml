[project]
name = "steady"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["anthropic==2.4.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["steady", "steady.analysis"]

[tool.setuptools.package-data]
steady = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
