# Steady: Garmin sync -> InfluxDB -> dashboard on :8080. Only the dashboard publishes a port.
services:
  fetch:
    build: ./sync
    restart: unless-stopped
    depends_on: [influxdb]
    volumes:
      - ./data/garminconnect-tokens:/home/appuser/.garminconnect  # owned by 1000:1000, mode 700
    environment:
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: "8086"
      INFLUXDB_USERNAME: ${INFLUXDB_USER}
      INFLUXDB_PASSWORD: ${INFLUXDB_PASSWORD}
      INFLUXDB_DATABASE: GarminStats
      FETCH_SELECTION: daily_avg,sleep,steps,heartrate,stress,breathing,hrv,fitness_age,vo2,activity,race_prediction,body_composition,lifestyle,training_status,training_readiness
      # MANUAL_START_DATE: set only for the one-off backfill run (see README)

  influxdb:
    image: influxdb:1.11.8
    restart: unless-stopped
    environment:
      INFLUXDB_DB: GarminStats
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      INFLUXDB_ADMIN_USER: ${INFLUXDB_USER}_admin
      INFLUXDB_ADMIN_PASSWORD: ${INFLUXDB_PASSWORD}
      INFLUXDB_USER: ${INFLUXDB_USER}
      INFLUXDB_USER_PASSWORD: ${INFLUXDB_PASSWORD}
      INFLUXDB_DATA_INDEX_VERSION: tsi1
    volumes:
      - ./data/influxdb:/var/lib/influxdb
    # no ports: internal network only

  app:
    build: ./app
    restart: unless-stopped
    depends_on: [influxdb]
    ports: ["8080:8080"]
    volumes:
      - ./data/app:/data
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_USER: ${INFLUXDB_USER}
      INFLUX_PASSWORD: ${INFLUXDB_PASSWORD}
      TZ: ${TZ:-Europe/Lisbon}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOAL: ${GOAL:-General health; improve running and strength}
